<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Markdown直接显示测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .raw { background: #f0f0f0; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
        .rendered { background: #f9f9f9; padding: 10px; margin: 10px 0; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>数字生态系统文档直接查看</h1>
    <button onclick="loadRaw()">加载原始内容</button>
    <button onclick="loadRendered()">渲染后内容</button>

    <h2>原始Markdown内容：</h2>
    <div id="raw-content" class="raw">点击"加载原始内容"按钮...</div>

    <h2>渲染后HTML内容：</h2>
    <div id="rendered-content" class="rendered">点击"渲染后内容"按钮...</div>

    <script>
        async function loadRaw() {
            try {
                const response = await fetch('digital_ecosystem.md');
                const text = await response.text();
                document.getElementById('raw-content').textContent = text.substring(0, 2000) + '...';
            } catch (error) {
                document.getElementById('raw-content').textContent = '加载失败: ' + error.message;
            }
        }

        async function loadRendered() {
            try {
                const response = await fetch('digital_ecosystem.md');
                const markdown = await response.text();

                // 只显示前2000字符进行测试
                const sample = markdown.substring(0, 2000);
                document.getElementById('rendered-content').innerHTML = sample;

            } catch (error) {
                document.getElementById('rendered-content').textContent = '加载失败: ' + error.message;
            }
        }
    </script>
</body>
</html>
