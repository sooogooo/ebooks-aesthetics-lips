<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>章节测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        #content {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            min-height: 200px;
        }
    </style>
</head>
<body>
    <h1>医学专著章节加载测试</h1>

    <div class="test-section">
        <h2>1. 文件存在性测试</h2>
        <div id="file-test">测试中...</div>
        <button onclick="testFiles()">测试文件</button>
    </div>

    <div class="test-section">
        <h2>2. 章节加载测试</h2>
        <select id="chapter-select">
            <option value="">选择章节...</option>
            <option value="00_preface.md">前言</option>
            <option value="01_cultural_aesthetics_enhanced.md">文化美学</option>
            <option value="02_scientific_principles.md">科学原理</option>
        </select>
        <button onclick="loadTestChapter()">加载章节</button>
        <div id="content">选择一个章节进行测试...</div>
    </div>

    <script>
        const testFiles = [
            '00_preface.md',
            '01_cultural_aesthetics_enhanced.md',
            '02_scientific_principles.md',
            '03_case_studies.md'
        ];

        async function testFiles() {
            const results = [];

            for (const file of testFiles) {
                try {
                    const response = await fetch(file, { method: 'HEAD' });
                    if (response.ok) {
                        results.push(`✅ ${file} - 存在`);
                    } else {
                        results.push(`❌ ${file} - HTTP ${response.status}`);
                    }
                } catch (error) {
                    results.push(`❌ ${file} - 错误: ${error.message}`);
                }
            }

            document.getElementById('file-test').innerHTML = results.join('<br>');
        }

        async function loadTestChapter() {
            const select = document.getElementById('chapter-select');
            const filename = select.value;

            if (!filename) {
                alert('请选择一个章节');
                return;
            }

            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '正在加载...';

            try {
                console.log('开始加载:', filename);

                const response = await fetch(filename);
                console.log('响应状态:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const text = await response.text();
                console.log('文本长度:', text.length);

                // 简单显示前1000个字符
                const preview = text.substring(0, 1000);
                contentDiv.innerHTML = `
                    <h3>加载成功！</h3>
                    <p><strong>文件大小:</strong> ${text.length} 字符</p>
                    <p><strong>内容预览:</strong></p>
                    <pre style="white-space: pre-wrap; max-height: 300px; overflow: auto;">${preview}${text.length > 1000 ? '...' : ''}</pre>
                `;

            } catch (error) {
                console.error('加载失败:', error);
                contentDiv.innerHTML = `
                    <h3>❌ 加载失败</h3>
                    <p><strong>错误:</strong> ${error.message}</p>
                    <p><strong>文件:</strong> ${filename}</p>
                `;
            }
        }

        // 页面加载时自动测试文件
        window.onload = testFiles;
    </script>
</body>
</html>
