<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字生态系统测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .content { background: #f9f9f9; padding: 20px; border-radius: 8px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>数字生态系统 - Markdown渲染测试</h1>
    <button onclick="loadAndRender()">加载并渲染文档</button>
    <div id="result"></div>
    <div id="content" class="content"></div>

    <script>
        // 简化的Markdown转HTML函数（与reader.html中相同）
        function convertMarkdownToHTML(markdown) {
            let html = markdown;

            // 标题 - 从最多的#开始处理，避免部分匹配
            html = html.replace(/^##### (.*$)/gim, '<h5>$1</h5>');
            html = html.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

            // 粗体和斜体
            html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // 代码
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // 链接
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

            // 列表项
            html = html.replace(/^\* (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^\d+\. (.*$)/gim, '<li>$1</li>');

            // 包装连续的列表项为ul
            html = html.replace(/((<li>.*?<\/li>\s*)+)/gs, '<ul>$1</ul>');

            // 引用块
            html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');

            // 段落处理
            const lines = html.split('\n');
            const processedLines = [];
            let inList = false;
            let inBlockquote = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line === '') {
                    if (!inList && !inBlockquote) {
                        processedLines.push('</p><p>');
                    }
                    continue;
                }

                if (line.startsWith('<ul>') || line.startsWith('<ol>')) {
                    inList = true;
                } else if (line.startsWith('</ul>') || line.startsWith('</ol>')) {
                    inList = false;
                }

                if (line.startsWith('<blockquote>')) {
                    inBlockquote = true;
                } else if (line.startsWith('</blockquote>')) {
                    inBlockquote = false;
                }

                processedLines.push(line);
            }

            html = processedLines.join('\n');

            // 包装段落
            if (!html.startsWith('<h') && !html.startsWith('<ul') && !html.startsWith('<ol') && !html.startsWith('<blockquote')) {
                html = '<p>' + html + '</p>';
            }

            // 清理多余的空段落和格式问题
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p>\s*<h/g, '<h');
            html = html.replace(/<\/h([1-6])>\s*<\/p>/g, '</h$1>');
            html = html.replace(/<p>\s*<ul>/g, '<ul>');
            html = html.replace(/<\/ul>\s*<\/p>/g, '</ul>');
            html = html.replace(/<p>\s*<blockquote>/g, '<blockquote>');
            html = html.replace(/<\/blockquote>\s*<\/p>/g, '</blockquote>');

            return html;
        }

        async function loadAndRender() {
            const resultDiv = document.getElementById('result');
            const contentDiv = document.getElementById('content');

            try {
                resultDiv.innerHTML = '<span class="success">正在加载 digital_ecosystem.md...</span>';

                const response = await fetch('digital_ecosystem.md');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const markdown = await response.text();
                resultDiv.innerHTML = `<span class="success">✅ 文件加载成功，长度: ${markdown.length} 字符</span>`;

                console.log('开始转换markdown...');
                const html = convertMarkdownToHTML(markdown);
                console.log('转换完成，HTML长度:', html.length);

                contentDiv.innerHTML = html;

                // 检查是否有裸露的标签
                const hasRawTags = html.includes('&lt;') || html.includes('&gt;') || (html.match(/<[^>]*>/g) || []).some(tag => {
                    return !['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'ul', 'ol', 'li', 'strong', 'em', 'code', 'blockquote', 'a'].some(validTag =>
                        tag.startsWith(`<${validTag}`) || tag === `</${validTag}>`
                    );
                });

                if (hasRawTags) {
                    resultDiv.innerHTML += '<br><span class="error">⚠️ 检测到可能的标签问题</span>';
                } else {
                    resultDiv.innerHTML += '<br><span class="success">✅ 无标签裸露问题</span>';
                }

            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ 加载失败: ${error.message}</span>`;
                console.error('加载失败:', error);
            }
        }
    </script>
</body>
</html>
